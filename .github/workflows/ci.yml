name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --check
    - run: cargo clippy
  build:
    strategy:
      matrix:
        toolchain: [stable, beta, nightly]
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - run: cargo build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
  ohos-emulator-test:
    name: Oniro Emulator Test
    runs-on: ubuntu-latest
    env:
      # Pinned to upstream HEAD that contains the device-hash fix. Drop the
      # --git/--rev flags below in favour of a plain `cargo install ohos-test-runner`
      # once a release with that fix is published.
      OHOS_TEST_RUNNER_REV: 4ad3e3e14845522a87bb4c4b4957d34323662183
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-ohos
      - name: Setup OpenHarmony SDK
        id: setup_sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: 6.1
      - name: Add OHOS toolchains to PATH
        run: |
          echo "$(dirname "${OHOS_SDK_NATIVE}")/toolchains" >> "$GITHUB_PATH"
        env:
          OHOS_SDK_NATIVE: ${{ steps.setup_sdk.outputs.ohos_sdk_native }}
      - name: Install ohos-test-runner
        run: |
          cargo install --locked \
            --git https://github.com/openharmony-rs/ohos-test-runner.git \
            --rev "${OHOS_TEST_RUNNER_REV}" \
            ohos-test-runner
      - name: Start Oniro emulator
        uses: openharmony-rs/emulator-action@v0.1
      - name: Let emulator services finish booting
        # hdc may connect before hitrace's recording backend is ready;
        # without this delay `hitrace --trace_begin` may fail with
        # "OpenRecording failed, errorCode(1)".
        run: sleep 20
      - name: Run OHOS trace smoke test
        run: cargo xtask ohos-trace-smoke
        env:
          OHOS_TARGET: x86_64-unknown-linux-ohos
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_LINKER: ${{ steps.setup_sdk.outputs.ohos_sdk_native }}/llvm/bin/x86_64-unknown-linux-ohos-clang
      - name: Upload OHOS trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-trace-artifacts
          path: |
            target/xtask/
            /tmp/oniro-emulator.log
